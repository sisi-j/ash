org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ash's own version. The launcher and the client ship in one installer, so
# this tracks the launcher's version in `Cargo.toml`.
mod_version=0.1.0
maven_group=com.ashlauncher

# The build toolchain, one version per target.
#
# Loom is modularised, so these are different artifacts rather than two
# versions of one - which is why a single Gradle build can carry both. The
# 1.8.9 side is pinned back because `legacy-looming` has no 1.17 or 1.18: its
# published versions stop at 1.16.1, and it has to match the Loom it companions.
#
# Names carry the version target rather than "legacy", which is a word that
# rots. `legacy-looming` and Legacy Yarn keep it because it is their name.
loom_version=1.18.2
loom_version_1_8_9=1.16.3
legacy_looming_version=1.16.1

# What the game side is built against. Every one of these is also pinned by
# the launcher in `launcher/core/src/loader.rs`, and they have to agree: the
# launcher installs the loader and API the client then declares it depends
# on. Moving one means moving both.
minecraft_version=1.21.11
loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11

# And the same for 1.8.9. A different loader build, a different API, and
# Legacy Yarn rather than Mojang's names - Mojang publishes none for 1.8.9.
minecraft_version_1_8_9=1.8.9
loader_version_1_8_9=0.19.3
legacy_yarn_build=604
legacy_fabric_api_version=1.13.5+1.8.9

# One JUnit wherever a module has tests, so they read the same everywhere.
junit_version=5.14.4

# What the shared module compiles its mixin checks against. Neither is bundled:
# each loader ships its own, and both targets' are the same API - Mixin 0.8.7
# in Fabric's 0.17.3 and 0.17.4 builds, ASM 9.10.1 in each. The older fork,
# so nothing here can use what 1.8.9's loader does not have.
mixin_version=0.17.3+mixin.0.8.7
asm_version=9.10.1

# Sodium, tested against and never shipped (ADR-0013, #48): the 1.21.11 game
# test runs a second time with this exact jar in its mods folder, as a player
# would add it. The URL and SHA-512 are Modrinth's for this version; the build
# refuses any other bytes. Moving it is a decision, not an update.
sodium_version=0.8.14+mc1.21.11
sodium_url=https://cdn.modrinth.com/data/AANobbMI/versions/rkdTcxoT/sodium-fabric-0.8.14%2Bmc1.21.11.jar
sodium_sha512=04c43f9e8534b87a52c42ffd51b0e344d4ef92dc9cc52da33d13af6a18bf74b05380d2027f1e0db982698d0aff274c42741c1e21b313b0cd75ed3af005fc98d9

# Lithium, for measuring it on 1.21.11 (#44) and nothing else: the benchmark
# loads it with -Pbench.lithium, from Modrinth, and refuses any other bytes.
# Re-queried on Modrinth on 2026-10-08: still the latest for 1.21.11.
lithium_version=0.21.4+mc1.21.11
lithium_url=https://cdn.modrinth.com/data/gvQqBUqZ/versions/Ow7wA0kG/lithium-fabric-0.21.4%2Bmc1.21.11.jar
lithium_sha512=f14a5c3d2fad786347ca25083f902139694f618b7c103947f2fd067a7c5ee88a63e1ef8926f7d693ea79ed7d00f57317bae77ef9c2d630bf5ed01ac97a752b94
