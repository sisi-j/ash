org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ash's own version. The launcher and the client ship in one installer, so
# this tracks the launcher's version in `Cargo.toml`.
mod_version=0.1.0
maven_group=com.ashlauncher

# The build toolchain, one version per target.
#
# Loom is modularised, so these are different artifacts rather than two
# versions of one - which is why a single Gradle build can carry both. The
# 1.8.9 side is pinned back because `legacy-looming` has no 1.17 or 1.18: its
# published versions stop at 1.16.1, and it has to match the Loom it companions.
#
# Names carry the version target rather than "legacy", which is a word that
# rots. `legacy-looming` and Legacy Yarn keep it because it is their name.
loom_version=1.18.2
loom_version_1_8_9=1.16.3
legacy_looming_version=1.16.1

# What the game side is built against. Every one of these is also pinned by
# the launcher in `launcher/core/src/loader.rs`, and they have to agree: the
# launcher installs the loader and API the client then declares it depends
# on. Moving one means moving both.
minecraft_version=1.21.11
loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11

# And the same for 1.8.9. A different loader build, a different API, and
# Legacy Yarn rather than Mojang's names - Mojang publishes none for 1.8.9.
minecraft_version_1_8_9=1.8.9
loader_version_1_8_9=0.19.3
legacy_yarn_build=604
legacy_fabric_api_version=1.13.5+1.8.9

# One JUnit wherever a module has tests, so they read the same everywhere.
junit_version=5.14.4
