// The 1.21.11 half of ash's client: everything that has to name a Minecraft
// type or a Fabric API one. Keep it thin - each class here should be a line or
// two over the game's own API, because nothing but a human will read it. The
// logic belongs in `:shared`, where a test can reach it.

plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version
group = maven_group

base {
    // A fixed name, with no version in it. The launcher looks this jar up by
    // name to place it in an instance, and the two ship in one installer, so a
    // version here would be a second place to change on every release - and
    // nothing would catch getting it wrong until a player's game came up with
    // no client in it. What version of ash is running is a question
    // `fabric.mod.json` answers, in the game's own mod list.
    archivesName = "ash-client-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang's own names: Fabric's recommendation for new mods, and what the
    // game itself uses from 26.1 onwards, so a later move is close to a no-op.
    // Loom fetches them at build time. They may not be redistributed complete
    // and unmodified, so nothing is committed - see ADR-0015.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Compiled against, and folded into the jar below.
    implementation project(':shared')

    // Fabric Loader JUnit: the loader, stood up inside the test JVM. It needs
    // a game jar on the class path and so cannot live in the shared module -
    // see `client/README.md`. Here the game is already there, which is what
    // makes it free.
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
}

tasks.named('test') {
    useJUnitPlatform()
    // The version the build expanded into `fabric.mod.json`, so the test can
    // say the expansion happened rather than repeating the literal.
    systemProperty 'ash.test.version', version
}

// 1.21.11 runs on Java 21, and the launcher provisions that runtime for it.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Fabric's client game tests: a real vanilla client, launched, driven and asked
// whether ash loaded. This is the tier ADR-0017 leans on - it is what catches
// a mixin that has stopped matching - and `eula = true` is a literal
// acceptance of the Minecraft EULA on behalf of whoever runs this build. That
// is a decision, not a template line: see
// `docs/adr/0016-ci-accepts-the-minecraft-eula.md`.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'ash-client-gametest'
        enableClientGameTests = true
        eula = true
    }
}

// The frame-time measurement (#42): a developer tool, run by hand on a real
// machine, in a source set of its own so nothing of it reaches a player's
// jar. Not the client game test tier above: that steps the game a frame at a
// time, which makes frame times mean nothing.
sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    benchmarkImplementation project(':bench')
}

// The benchmark's player, by name: the local benchmark server makes it an operator.
ext.BENCH_PLAYER = 'AshBench'

loom {
    runs {
        // `./gradlew :target-1.21.11:runBenchmark`, with `-Pbench.label=...`
        // to name the run. Results go to `client/benchmark-results`, outside
        // `build` so a clean keeps them. See `client/README.md`.
        benchmark {
            client()
            configName = 'ash frame-time measurement (1.21.11)'
            source 'benchmark'
            runDir 'build/run/benchmark'
            // A fixed name, so the local benchmark server can make it an operator.
            programArgs '--width', '1280', '--height', '720', '--username', BENCH_PLAYER
            property 'ash.bench.label', (project.findProperty('bench.label') ?: '').toString()
            property 'ash.bench.out', rootProject.file('benchmark-results').absolutePath
            // `-Pbench.server=127.0.0.1:25599` joins the local benchmark server;
            // `-Pbench.lithium` loads Lithium (#44). See `client/README.md`.
            property 'ash.bench.server', (project.findProperty('bench.server') ?: '').toString()
            property 'ash.bench.lithium', project.hasProperty('bench.lithium').toString()
        }
    }
}

// ---- Lithium, measured (#44) ------------------------------------------------

// Measured, never shipped from here: whether ash bundles Lithium is what the
// measurement decides. The pin is in `gradle.properties`.
def lithiumJar = layout.buildDirectory.file("lithium/lithium-fabric-${lithium_version}.jar")

tasks.register('downloadLithium') {
    group = 'verification'
    description = 'Fetches the pinned Lithium jar and refuses it unless its SHA-512 is the pinned one.'
    inputs.property('url', lithium_url)
    inputs.property('sha512', lithium_sha512)
    outputs.file(lithiumJar)

    doLast {
        def jar = lithiumJar.get().asFile
        jar.parentFile.mkdirs()
        new URI(lithium_url).toURL().withInputStream { input -> jar.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance('SHA-512').digest(jar.bytes).encodeHex().toString()
        if (digest != lithium_sha512) {
            jar.delete()
            throw new GradleException("Lithium ${lithium_version} from ${lithium_url} is not the jar that was pinned:"
                    + " its SHA-512 is ${digest}")
        }
    }
}

def benchmarkMods = file('build/run/benchmark/mods')
def withLithium = project.hasProperty('bench.lithium')

tasks.register('prepareBenchmarkMods') {
    description = 'Puts the pinned Lithium in the benchmark run\'s mods with -Pbench.lithium, and takes it out without.'
    if (withLithium) {
        dependsOn 'downloadLithium'
    }
    doLast {
        project.delete(project.fileTree(benchmarkMods) { include 'lithium-*.jar' })
        if (withLithium) {
            project.copy {
                from lithiumJar
                into benchmarkMods
            }
        }
    }
}

tasks.named('runBenchmark') {
    dependsOn 'prepareBenchmarkMods'
}

// ---- the local benchmark server (#44) ---------------------------------------

// Mojang's own dedicated server, as real servers run it, on this machine only:
// `./gradlew :target-1.21.11:prepareBenchmarkServer`, then start it from
// `build/run/benchmark-server` with `java -jar server.jar nogui`. It answers on
// 127.0.0.1 alone, in offline mode, with the benchmark's player an operator so
// it can set the scene by command. See `client/README.md`.
def benchmarkServerDir = file('build/run/benchmark-server')

tasks.register('prepareBenchmarkServer') {
    description = 'The vanilla dedicated server for the benchmark: verified against Mojang\'s manifest, and configured.'
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def manifest = slurper.parse(new URI('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json').toURL())
        def entry = manifest.versions.find { it.id == minecraft_version }
        if (entry == null) {
            throw new GradleException("Mojang's manifest has no ${minecraft_version}")
        }
        def download = slurper.parse(new URI(entry.url).toURL()).downloads.server
        benchmarkServerDir.mkdirs()
        def jar = new File(benchmarkServerDir, 'server.jar')
        def sha1 = { File f -> java.security.MessageDigest.getInstance('SHA-1').digest(f.bytes).encodeHex().toString() }
        if (!jar.isFile() || sha1(jar) != download.sha1) {
            new URI(download.url).toURL().withInputStream { input -> jar.withOutputStream { it << input } }
            if (sha1(jar) != download.sha1) {
                jar.delete()
                throw new GradleException("the ${minecraft_version} server from ${download.url} is not the one Mojang lists")
            }
        }
        // Accepted for this local run as for the game tests, by the same
        // decision: docs/adr/0016-ci-accepts-the-minecraft-eula.md.
        new File(benchmarkServerDir, 'eula.txt').text = '# Accepted by ash\'s build, as for its game tests:' +
                ' docs/adr/0016-ci-accepts-the-minecraft-eula.md\neula=true\n'
        new File(benchmarkServerDir, 'server.properties').text = [
            '# The benchmark scene, as a server: see client/README.md.',
            'server-ip=127.0.0.1',
            'server-port=25599',
            'online-mode=false',
            'enforce-secure-profile=false',
            'level-name=ash-benchmark',
            'level-seed=4242',
            'gamemode=spectator',
            'force-gamemode=true',
            'difficulty=peaceful',
            'spawn-protection=0',
            'view-distance=8',
            'motd=ash benchmark',
        ].join('\n') + '\n'
        def uuid = UUID.nameUUIDFromBytes("OfflinePlayer:${BENCH_PLAYER}".getBytes('UTF-8'))
        new File(benchmarkServerDir, 'ops.json').text =
                "[{\"uuid\": \"${uuid}\", \"name\": \"${BENCH_PLAYER}\", \"level\": 4, \"bypassesPlayerLimit\": false}]\n"
    }
}

processResources {
    // Written into `fabric.mod.json` rather than repeated there, so what the
    // client declares it needs cannot drift from what it was built against.
    inputs.property 'version', version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'loader_version', loader_version

    filesMatching('fabric.mod.json') {
        expand version: version,
                minecraft_version: minecraft_version,
                loader_version: loader_version
    }
}

tasks.named('jar') {
    // Fabric Loader loads one jar. The shared module's classes go inside this
    // one; a library jar sitting beside it would simply not be there.
    from project(':shared').sourceSets.main.output
}

// The version lives in `fabric.mod.json`, not in the file name - see
// `archivesName` above.
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = ''
}

// Nothing of the frame-time measurement may reach a player: the jar the
// launcher ships is opened and checked on every build, rather than trusted
// to leave out a source set it was never told about.
tasks.register('checkJarHasNoBenchmark') {
    group = 'verification'
    description = 'Fails if the jar a player gets holds any of the frame-time measurement.'
    def shipped = tasks.named('remapJar').flatMap { it.archiveFile }
    inputs.file(shipped)

    doLast {
        def offences = []
        def entries = 0
        zipTree(shipped.get().asFile).visit { entry ->
            entries++
            def path = entry.relativePath.pathString
            if (path.startsWith('com/ashlauncher/client/bench/') || path.contains('AshBenchmark')) {
                offences << path
            }
        }
        if (entries == 0) {
            throw new GradleException('the shipped jar is empty - this check proved nothing')
        }
        if (!offences.isEmpty()) {
            throw new GradleException('the frame-time measurement reached the jar a player gets:\n  '
                    + offences.join('\n  '))
        }
    }
}

tasks.named('check') {
    dependsOn 'checkJarHasNoBenchmark'
}

// ---- the game test again, with Sodium (#48) --------------------------------

// Sodium's mixin configs are required, so a clash with one of ash's is a
// crash at launch - in a player's game, if nothing finds it first. So the
// client game test runs a second time with Sodium in the mods folder, as a
// player would add it. Tested against, never shipped: nothing here reaches
// the jar (ADR-0013). The pin is in `gradle.properties`.
def sodiumJar = layout.buildDirectory.file("sodium/sodium-fabric-${sodium_version}.jar")

tasks.register('downloadSodium') {
    group = 'verification'
    description = 'Fetches the pinned Sodium jar and refuses it unless its SHA-512 is the pinned one.'
    inputs.property('url', sodium_url)
    inputs.property('sha512', sodium_sha512)
    outputs.file(sodiumJar)

    doLast {
        def jar = sodiumJar.get().asFile
        jar.parentFile.mkdirs()
        new URI(sodium_url).toURL().withInputStream { input -> jar.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance('SHA-512').digest(jar.bytes).encodeHex().toString()
        if (digest != sodium_sha512) {
            jar.delete()
            throw new GradleException("Sodium ${sodium_version} from ${sodium_url} is not the jar that was pinned:"
                    + " its SHA-512 is ${digest}")
        }
    }
}

def sodiumRunDir = file('build/run/clientGameTestSodium')

loom {
    runs {
        // Everything the plain game test has, in a run directory of its own
        // with Sodium in its `mods`. The loader remaps a mod there at launch,
        // as it would a player's. The test is told, so it can insist Sodium
        // really loaded - a second run that quietly ran without it would
        // prove nothing.
        clientGameTestSodium {
            inherit(loom.runs.getByName('clientGameTest'))
            configName = 'ash client game test, with Sodium (1.21.11)'
            runDir 'build/run/clientGameTestSodium'
            property 'ash.gametest.sodium', 'true'
        }
    }
}

tasks.register('prepareSodiumGameTest') {
    description = 'A clean run directory for the game test with Sodium: the pinned jar in its mods, and the EULA.'
    dependsOn 'downloadSodium'
    doLast {
        project.delete(sodiumRunDir)
        project.copy {
            from sodiumJar
            into new File(sodiumRunDir, 'mods')
        }
        // Accepted for this run as for the game test without Sodium, by the
        // same decision: docs/adr/0016-ci-accepts-the-minecraft-eula.md.
        new File(sodiumRunDir, 'eula.txt').text = '# Accepted by ash\'s build, as for the game test without Sodium:' +
                ' docs/adr/0016-ci-accepts-the-minecraft-eula.md\neula=true\n'
    }
}

tasks.named('runClientGameTestSodium') {
    dependsOn 'prepareSodiumGameTest'
}
