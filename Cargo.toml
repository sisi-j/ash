[workspace]
resolver = "2"
members = ["launcher/core", "launcher/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.dependencies]
ash-core = { path = "launcher/core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
