name: checks

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    # Windows, because that is what v1 ships on, and what ash's path
    # handling, credential store and process spawning actually run against.
    # macOS joins this matrix when Phase 5 does.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml decides the version. Installed up front so a
      # missing toolchain fails here rather than inside a build step, and
      # explicitly, because rustup has deprecated auto-installing it.
      - run: rustup install --no-self-update

      # Only the registry. A cached `target` for both the test and clippy
      # profiles runs into the 10GB cache ceiling, and a cache that silently
      # stops being written is worse than none.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # No secrets and no network: every test drives ash through its seam
      # with fakes for HTTP, the credential store and process spawning.
      - run: cargo test --workspace

  client:
    # Linux. `./gradlew build` is pure Java and runs anywhere, so this is
    # simply where it is cheapest - and the client game tests that follow in
    # #22 need xvfb, which Loom only wires up on a Linux runner, so this is
    # the runner they will have to land on anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is a binary in the repository. This checks it against
      # Gradle's published checksums, so a tampered-with one cannot quietly
      # run as part of the build.
      - uses: gradle/actions/wrapper-validation@v6

      # The JDK that *builds*, which is not the JDK the game runs on. Fabric
      # Loom 1.18 is compiled for Java 25 and refuses to resolve on anything
      # older; the game on 1.21.11 wants 21 and on 1.8.9 wants 8, and the
      # launcher provisions those itself. `--release` in each module decides
      # what bytecode comes out, so one modern JDK builds both targets.
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # Compiles both modules, runs the shared module's unit tests and the
      # target module's Fabric Loader JUnit tests, and runs `checkNoGameTypes`
      # - which is what stops the shared module quietly growing a dependency
      # on one version target. Also compiles each target's frame-time
      # measurement, which only a human runs, so it cannot quietly stop
      # building; `build` itself checks none of it is in a player's jar.
      - run: ./gradlew build :target-1.21.11:compileBenchmarkJava :target-1.8.9:compileBenchmarkJava
        working-directory: client

      # The jar the installer ships. Kept so that a build from any commit can
      # be dropped into an instance and looked at without a Java toolchain,
      # which is the only way some of #20's acceptance criteria can be seen at
      # all.
      - uses: actions/upload-artifact@v7
        with:
          name: ash-client
          path: client/*/build/libs/*.jar
          if-no-files-found: error

  client-game-test:
    # The tier ADR-0017 leans on: a real vanilla client on each version
    # target, launched, asked whether ash is in it. Its own job rather than a
    # step in `client`, because
    # it downloads the game's assets and starts a JVM with a window in it -
    # orders of magnitude slower than compiling, and the fast signal should stay
    # fast.
    #
    # Linux is not a preference here. Loom wraps a client run in `xvfb-run` on
    # Linux and nowhere else, and there is no equivalent for a Windows or macOS
    # runner - so this tier is a Linux-runner capability, whatever the rest of
    # ash ships on.
    #
    # Every run of this accepts the Minecraft EULA on behalf of whoever owns
    # this repository. That is deliberate and recorded:
    # `docs/adr/0016-ci-accepts-the-minecraft-eula.md`.
    runs-on: ubuntu-latest
    # Both tiers launch a game and wait for it to say something. A client that
    # comes up but never reaches the code that would stop it does not fail -
    # it sits there, and the default is GitHub's six hours. The smoke test has
    # its own 180-second watchdog, but that only runs if its mod loaded at all.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      # Fabric's own client game tests. Drives a real vanilla client and asks
      # it whether ash is there.
      - run: ./gradlew :target-1.21.11:runClientGameTest
        working-directory: client

      # The same test again with Sodium in the mods folder, as a player would
      # add it (#48). Its mixins are required, so a clash with ash's is a
      # crash at launch, found here instead of in a player's game. The jar is
      # pinned by version and SHA-512 in `client/gradle.properties`, tested
      # against and never shipped (ADR-0013).
      - if: ${{ !cancelled() }}
        run: ./gradlew :target-1.21.11:runClientGameTestSodium
        working-directory: client

      # LWJGL 2 looks for an `xrandr` executable on PATH and gives up on
      # display modes when it finds none, so without this the 1.8.9 client
      # crashes on a runner that has Xvfb but not `x11-xserver-utils`. Why
      # that is, and why the modern target needs none of it, is in
      # `docs/adr/0016-ci-accepts-the-minecraft-eula.md`.
      #
      # `!cancelled()` rather than the default, here and on the step below,
      # because steps stop at the first failure and these are two independent
      # questions. Without it a modern-target failure skips the 1.8.9 tier
      # entirely and the run cannot say whether 1.8.9 was fine - which cost a
      # round trip to find out during #22, in run 35447474438.
      - if: ${{ !cancelled() }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends x11-xserver-utils

      # 1.8.9 has no such framework - Legacy Fabric API ships no gametest
      # module at all - so this is ash's own miniature of it: a real vanilla
      # client, launched the same way, that reports and then shuts itself down.
      # Separately timed, because the two are not the same tier and a single
      # number would hide that.
      - if: ${{ !cancelled() }}
        run: ./gradlew :target-1.8.9:runSmokeTest
        working-directory: client

      # Kept whether they passed or failed. When one of these goes wrong, the
      # difference between a stack trace and a picture of the screen is most of
      # the diagnosis. Worth knowing: on 1.8.9 the log is nearly empty, because
      # Log4j rejects most of Fabric's logging config on that game version -
      # which is why the smoke test prints its own mod list to standard out.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-game-test
          path: |
            client/target-1.21.11/build/run/clientGameTest/screenshots/
            client/target-1.21.11/build/run/clientGameTest/logs/
            client/target-1.21.11/build/run/clientGameTestSodium/screenshots/
            client/target-1.21.11/build/run/clientGameTestSodium/logs/
            client/target-1.8.9/build/run/smoketest/logs/
            client/target-1.8.9/build/run/smoketest/screenshots/
          if-no-files-found: ignore

  typescript:
    # Nothing here is platform-specific, so it runs where it is cheapest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
        working-directory: launcher
      - run: npx tsc --noEmit
        working-directory: launcher
      # Unit tests on node's own runner: the news Markdown parser.
      - run: npm test
        working-directory: launcher
      # The launcher UI check: every screen state in Chromium against a fake
      # of the launcher's API, failing on an error or on any text not drawn
      # in the bundled Inter. Screenshots are uploaded for a person to look
      # at, never compared.
      - run: npx playwright install --with-deps chromium
        working-directory: launcher
      - run: npm run check:ui
        working-directory: launcher
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launcher-ui
          path: launcher/ui-check/screenshots/
          if-no-files-found: ignore

  backend-contract:
    # ash-core's fake of ash's backend serves copies of the backend's own
    # contract examples (ADR-0021). The copies must be what the backend's
    # tests check today, or the launcher is tested against a backend that no
    # longer exists. A backend change fails here until the copies follow it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The copies match sisi-j/ash-backend's contract
        run: |
          for copy in launcher/core/tests/fixtures/backend/*.json; do
            name=$(basename "$copy")
            curl -fsSL "https://raw.githubusercontent.com/sisi-j/ash-backend/main/contract/$name" \
              | diff -u - "$copy"
          done

  installed:
    # The real installer, installed, and asked whether it can start a modded
    # instance - `ash --self-check`. Only an installation is laid out the way
    # an installation is: on 8 October 2026 the installed ash handed the game
    # its client jar in Windows' verbatim form, `\?\C:\...`, which 1.8.9's
    # Java cannot read, and nothing before this job could have seen it. The
    # check resolves the client folder exactly as the installed launcher does
    # and inspects the very argument a launch would send.
    runs-on: windows-latest
    needs: client
    steps:
      - uses: actions/checkout@v7

      # The jars the installer carries, from the client job, where `build`
      # would put them.
      - uses: actions/download-artifact@v7
        with:
          name: ash-client
          path: client

      - run: rustup install --no-self-update
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
        working-directory: launcher

      # The installer a player gets: `build:installer`, which carries the
      # client jars.
      - run: npm run build:installer
        working-directory: launcher

      # Silently, per machine, as the installer is configured to install;
      # the runner is an administrator, so there is no prompt to answer.
      - name: Install
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }

      - name: Self-check
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:ProgramFiles\ash\*.exe" | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw "no ash executable in $env:ProgramFiles\ash" }
          $report = Join-Path $env:RUNNER_TEMP 'self-check.txt'
          $check = Start-Process -FilePath $exe.FullName -ArgumentList '--self-check', "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Output 'no report was written' }
          if ($check.ExitCode -ne 0) { throw "the installed ash's self-check exited with $($check.ExitCode)" }
