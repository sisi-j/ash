name: checks

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    # Windows, because that is what v1 ships on, and what ash's path
    # handling, credential store and process spawning actually run against.
    # macOS joins this matrix when Phase 5 does.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml decides the version. Installed up front so a
      # missing toolchain fails here rather than inside a build step, and
      # explicitly, because rustup has deprecated auto-installing it.
      - run: rustup install --no-self-update

      # Only the registry. A cached `target` for both the test and clippy
      # profiles runs into the 10GB cache ceiling, and a cache that silently
      # stops being written is worse than none.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # No secrets and no network: every test drives ash through its seam
      # with fakes for HTTP, the credential store and process spawning.
      - run: cargo test --workspace

  client:
    # Linux. `./gradlew build` is pure Java and runs anywhere, so this is
    # simply where it is cheapest - and the client game tests that follow in
    # #22 need xvfb, which Loom only wires up on a Linux runner, so this is
    # the runner they will have to land on anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is a binary in the repository. This checks it against
      # Gradle's published checksums, so a tampered-with one cannot quietly
      # run as part of the build.
      - uses: gradle/actions/wrapper-validation@v6

      # 21 because that is what 1.21.11 runs on and what Loom expects for it.
      # The 1.8.9 module #21 adds will still build here: a modern JDK emits
      # Java 8 bytecode with `--release 8`, and only the game needs Java 8.
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # Compiles both modules, runs the shared module's unit tests and the
      # target module's Fabric Loader JUnit tests, and runs `checkNoGameTypes`
      # - which is what stops the shared module quietly growing a dependency
      # on one version target.
      - run: ./gradlew build
        working-directory: client

      # The jar the installer ships. Kept so that a build from any commit can
      # be dropped into an instance and looked at without a Java toolchain,
      # which is the only way some of #20's acceptance criteria can be seen at
      # all.
      - uses: actions/upload-artifact@v7
        with:
          name: ash-client
          path: client/*/build/libs/*.jar
          if-no-files-found: error

  typescript:
    # Nothing here is platform-specific, so it runs where it is cheapest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
        working-directory: launcher
      - run: npx tsc --noEmit
        working-directory: launcher
