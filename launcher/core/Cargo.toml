[package]
name = "ash-core"
description = "All launcher behaviour. No Tauri, no UI, no globals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The OS credential store. Refresh tokens never touch a file ash writes.
keyring = "4"
uuid = { version = "1", features = ["v4"] }
# rustls-native-certs (not webpki-roots) so a corporate MITM proxy with a
# locally trusted CA works; system-proxy so we honour the OS proxy settings.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "system-proxy",
    "http2",
] }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
