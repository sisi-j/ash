[package]
name = "ash-launcher"
description = "Thin Tauri adapter over ash-core. Holds no logic of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ash_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ash-core.workspace = true
serde.workspace = true
# tauri::generate_context! writes plugin configuration (the updater's key) as JSON values.
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Updates (ADR-0025): signed releases, checked against the key in tauri.conf.json.
tauri-plugin-updater = "2"
tokio = { workspace = true, features = ["time"] }
